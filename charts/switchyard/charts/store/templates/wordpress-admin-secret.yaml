{{- if not .Values.setup.existingAdminSecret }}
{{- $ns := include "store.namespace" . }}
# WordPress admin login. Read it with: make admin-password
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-admin
  namespace: {{ $ns }}
  labels:
    {{- include "store.labels" (dict "root" . "component" "wordpress") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ include "store.secretValue" (dict "ns" $ns "name" "wordpress-admin" "key" "admin-password" "length" 24) }}
{{- end }}
