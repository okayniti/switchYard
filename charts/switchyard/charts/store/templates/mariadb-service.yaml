{{- $c := dict "root" . "component" "mariadb" }}
# Headless: gives the StatefulSet pod a stable DNS name (mariadb.store.svc). Internal only.
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: {{ include "store.namespace" . }}
  labels:
    {{- include "store.labels" $c | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "store.selectorLabels" $c | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
