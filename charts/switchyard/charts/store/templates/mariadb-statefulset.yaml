{{- $c := dict "root" . "component" "mariadb" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: {{ include "store.namespace" . }}
  labels:
    {{- include "store.labels" $c | nindent 4 }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      {{- include "store.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.labels" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The official image's "mysql" user. fsGroup makes the PVC writable by it.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.username | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store.mariadbSecretName" . }}
                  key: mariadb-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store.mariadbSecretName" . }}
                  key: mariadb-root-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # Writable paths the server needs while the root filesystem is read-only.
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "store.selectorLabels" $c | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storage }}
