{{- if not .Values.mariadb.existingSecret }}
{{- $ns := include "store.namespace" . }}
apiVersion: v1
kind: Secret
metadata:
  name: mariadb
  namespace: {{ $ns }}
  labels:
    {{- include "store.labels" (dict "root" . "component" "mariadb") | nindent 4 }}
  annotations:
    # Keep the Secret (and therefore the data on the PVC stays readable) if the release is uninstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-root-password: {{ include "store.secretValue" (dict "ns" $ns "name" "mariadb" "key" "mariadb-root-password") }}
  mariadb-password: {{ include "store.secretValue" (dict "ns" $ns "name" "mariadb" "key" "mariadb-password") }}
{{- end }}
