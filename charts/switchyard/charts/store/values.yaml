# Store subchart defaults. Secrets are generated by Helm (lookup) or referenced via existingSecret.

mariadb:
  # Set to the name of a pre-created Secret (prod) to skip generation. It must contain
  # the keys mariadb-root-password and mariadb-password.
  existingSecret: ""
  database: wordpress
  username: wordpress
  image: mariadb:11.8.9
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

wordpress:
  image:
    repository: switchyard-wordpress
    tag: dev
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: "1", memory: 512Mi }
