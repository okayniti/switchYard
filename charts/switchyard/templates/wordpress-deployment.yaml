{{- $c := dict "root" . "component" "wordpress" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: {{ include "store.namespace" . }}
  labels:
    {{- include "switchyard.labels" $c | nindent 4 }}
spec:
  replicas: 1
  # The content volume is ReadWriteOnce: stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "switchyard.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switchyard.labels" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33     # www-data, baked into the image
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # local-path volumes are hostPath dirs owned by root (0777) and ignore fsGroup, so
        # www-data can write into the root but not chmod it — which the entrypoint's tar
        # copy needs. Creating html/ as www-data gives a directory it owns.
        - name: prepare-content
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sh", "-c", "mkdir -p /pvc/html"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: content
              mountPath: /pvc
      containers:
        - name: wordpress
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "store.wordpressEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          # Readiness hits PHP + DB: an unhealthy store leaves the Service, so the Ingress
          # stops routing to it. 2xx/3xx both count (302 before core is installed).
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness only checks Apache accepts connections. A DB outage must not
          # restart WordPress pods (that would turn one failure into a restart storm).
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            # Apache/PHP write only to the volumes below; the rest of the image is immutable.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: content
              mountPath: /var/www/html
              subPath: html
            - name: apache-mpm
              mountPath: /etc/apache2/conf-enabled/zz-switchyard-mpm.conf
              subPath: zz-switchyard-mpm.conf
              readOnly: true
            - name: apache-run
              mountPath: /var/run/apache2
            - name: apache-lock
              mountPath: /var/lock/apache2
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: wordpress-content
        - name: apache-run
          emptyDir: {}
        - name: apache-lock
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: apache-mpm
          configMap:
            name: wordpress-apache
