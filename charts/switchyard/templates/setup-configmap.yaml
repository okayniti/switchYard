{{- $c := dict "root" . "component" "store-setup" }}
# The setup Job's script. A normal (non-hook) resource, so it exists before the hook Job runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: store-setup
  namespace: {{ include "store.namespace" . }}
  labels:
    {{- include "store.labels" $c | nindent 4 }}
data:
  setup.sh: |
    #!/usr/bin/env bash
    # Configures the store with wp-cli. Every step is safe to re-run (helm upgrade runs it again).
    set -euo pipefail
    log() { echo "[setup] $(date -u +%H:%M:%S) $*"; }

    # Every wp-cli call is bounded, and slow ones are named in the log, so a hang fails
    # fast (the Job retries) instead of silently eating activeDeadlineSeconds.
    wp() {
      local start=$SECONDS rc=0
      timeout 120 /usr/local/bin/wp "$@" || rc=$?
      if (( SECONDS - start > 10 )); then log "slow: wp $1 ${2:-} took $((SECONDS - start))s"; fi
      if (( rc == 124 )); then log "timeout: wp $*"; fi
      return $rc
    }

    log "waiting for wp-config.php (written by the WordPress pod on first start)"
    for i in $(seq 1 60); do
      [ -s wp-config.php ] && break
      sleep 5
    done
    [ -s wp-config.php ] || { log "wp-config.php never appeared"; exit 1; }

    log "waiting for MariaDB"
    for i in $(seq 1 60); do
      if php -r '
        [$h, $p] = array_pad(explode(":", getenv("WORDPRESS_DB_HOST")), 2, 3306);
        $m = @new mysqli($h, getenv("WORDPRESS_DB_USER"), getenv("WORDPRESS_DB_PASSWORD"), getenv("WORDPRESS_DB_NAME"), (int)$p);
        exit($m->connect_errno ? 1 : 0);'; then
        break
      fi
      sleep 5
    done

    if wp core is-installed; then
      log "WordPress core already installed"
    else
      log "installing WordPress core"
      wp core install \
        --url="$STORE_URL" \
        --title="$STORE_TITLE" \
        --admin_user="$ADMIN_USER" \
        --admin_password="$ADMIN_PASSWORD" \
        --admin_email="$ADMIN_EMAIL" \
        --skip-email
    fi

    # --- WooCommerce: installed from the zip baked into the image (no runtime download) ---
    installed="$(wp plugin get woocommerce --field=version 2>/dev/null || true)"
    if [ "$installed" != "$WOOCOMMERCE_VERSION" ]; then
      log "installing WooCommerce $WOOCOMMERCE_VERSION (found: ${installed:-none})"
      wp plugin install /usr/src/woocommerce.zip --force
    fi
    wp plugin is-active woocommerce || wp plugin activate woocommerce
    # Run any pending WooCommerce DB migrations (needed after a version bump).
    wp wc update

    log "store settings: Asia/Kolkata, INR, India address, pretty permalinks"
    wp option update timezone_string "Asia/Kolkata"
    # The official image already ships the WordPress .htaccess, so no --hard rewrite.
    wp rewrite structure '/%postname%/'
    wp option update woocommerce_currency "INR"
    wp option update woocommerce_default_country "IN:KA"
    wp option update woocommerce_store_address "1 MG Road"
    wp option update woocommerce_store_city "Bengaluru"
    wp option update woocommerce_store_postcode "560001"
    wp option update woocommerce_calc_taxes "no"

    log "skip onboarding, make the store public"
    wp option update woocommerce_onboarding_profile '{"skipped":true}' --format=json
    # New WooCommerce stores start in "coming soon" mode, which hides the storefront.
    wp option update woocommerce_coming_soon "no"
    wp option update woocommerce_store_pages_only "no"
    # Shop / Cart / Checkout / My account pages; the tool skips pages that exist.
    wp wc tool run install_pages --user="$ADMIN_USER"

    log "enable Cash on Delivery (DoD checkout method)"
    wp wc payment_gateway update cod --enabled=true --user="$ADMIN_USER" --porcelain
    wp wc payment_gateway get cod --field=enabled --user="$ADMIN_USER"

    log "seed sample products (keyed by SKU, so re-runs never duplicate)"
    seed() { # sku, name, price (string, as the WC API expects), stock
      if [ -n "$(wp wc product list --sku="$1" --field=id --user="$ADMIN_USER")" ]; then
        log "  $1 exists"
      else
        wp wc product create --user="$ADMIN_USER" --porcelain \
          --sku="$1" --name="$2" --regular_price="$3" \
          --manage_stock=true --stock_quantity="$4" --status=publish >/dev/null
        log "  $1 created"
      fi
    }
    seed SY-TEA-250     "Darjeeling First Flush Tea 250g"   "450" 50
    seed SY-COFFEE-500  "South Indian Filter Coffee 500g"   "320" 50
    seed SY-TOWEL-01    "Handloom Cotton Towel"             "299" 40
    seed SY-DIYA-01     "Brass Diya"                        "549" 25
    seed SY-CUSHION-01  "Jaipur Block Print Cushion Cover"  "699" 30

    log "register the WooCommerce REST key for woo-mcp"
    # Least privilege: the key belongs to a shop_manager (products + orders), not the admin.
    wp user get "$API_USER" --field=ID >/dev/null 2>&1 || \
      wp user create "$API_USER" "$API_USER_EMAIL" --role=shop_manager --porcelain >/dev/null
    # Same row format as WooCommerce's own key creation (WC_Auth::create_keys): the consumer
    # key is stored as hmac-sha256(key, 'wc-api'), the secret as-is, plus the last 7 chars.
    # Delete-then-insert keyed on the description keeps re-runs idempotent.
    wp eval '
      global $wpdb;
      $table = $wpdb->prefix . "woocommerce_api_keys";
      $desc  = "switchyard woo-mcp";
      $ck    = getenv("WC_CONSUMER_KEY");
      $cs    = getenv("WC_CONSUMER_SECRET");
      $user  = get_user_by("login", getenv("API_USER"));
      $wpdb->delete($table, array("description" => $desc));
      $ok = $wpdb->insert($table, array(
        "user_id"         => $user->ID,
        "description"     => $desc,
        "permissions"     => "read_write",
        "consumer_key"    => wc_api_hash($ck),
        "consumer_secret" => $cs,
        "truncated_key"   => substr($ck, -7),
      ));
      if (!$ok) { fwrite(STDERR, "key insert failed: " . $wpdb->last_error . "\n"); exit(1); }
      echo "registered key ..." . substr($ck, -7) . " for user " . $user->user_login . "\n";'

    log "done"
