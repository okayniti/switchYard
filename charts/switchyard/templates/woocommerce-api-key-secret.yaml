{{- if not .Values.wooApiKey.existingSecret }}
{{- $name := .Values.wooApiKey.secretName }}
{{- $storeNs := include "store.namespace" . }}
{{- /* Same format WooCommerce uses: prefix + 40 hex chars (wc_rand_hash). */}}
{{- $existing := lookup "v1" "Secret" $storeNs $name }}
{{- $ck := "" }}
{{- $cs := "" }}
{{- if and $existing (hasKey $existing.data "consumer-key") }}
{{- $ck = index $existing.data "consumer-key" | b64dec }}
{{- $cs = index $existing.data "consumer-secret" | b64dec }}
{{- else }}
{{- $ck = printf "ck_%s" (sha1sum (randAlphaNum 64)) }}
{{- $cs = printf "cs_%s" (sha1sum (randAlphaNum 64)) }}
{{- end }}
{{- range $ns := list $storeNs .Values.global.namespaces.mcp }}
---
# Used by: {{ if eq $ns $storeNs }}the setup Job (registers the key in WooCommerce){{ else }}woo-mcp (signs REST calls){{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "switchyard.labels" (dict "root" $ "component" "woocommerce-api-key") | nindent 4 }}
type: Opaque
data:
  consumer-key: {{ $ck | b64enc }}
  consumer-secret: {{ $cs | b64enc }}
{{- end }}
{{- end }}
