{{- if .Values.postgres.enabled }}
{{- $ns := .Values.global.namespaces.platform }}
{{- $c := dict "root" . "component" "postgres" }}
# Gateway database: users, API key hashes, servers (encrypted credentials), audit log.
{{ include "switchyard.sharedSecret" (dict "root" $ "name" "postgres" "namespaces" (list $ns) "keys" (dict "password" 32)) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    {{- include "switchyard.labels" $c | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "switchyard.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switchyard.labels" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- with .Values.postgres.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          startupProbe:
            exec: { command: ["pg_isready", "-U", "{{ .Values.postgres.username }}", "-d", "{{ .Values.postgres.database }}"] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "{{ .Values.postgres.username }}", "-d", "{{ .Values.postgres.database }}"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "{{ .Values.postgres.username }}", "-d", "{{ .Values.postgres.database }}"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # postgres 18 images keep PGDATA under /var/lib/postgresql/<major>/docker.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    {{- include "switchyard.labels" $c | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "switchyard.selectorLabels" $c | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
