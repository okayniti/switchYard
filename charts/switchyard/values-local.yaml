# Local k3d environment. Used by `make up` / `make install`.
# *.localtest.me is public DNS that resolves to 127.0.0.1 (fallback: add the three hosts
# to /etc/hosts or C:\Windows\System32\drivers\etc\hosts). k3d maps host 80/443 to Traefik.
# No secrets here: Helm generates them in-cluster on first install (lookup keeps them stable).

global:
  hosts:
    shop: shop.localtest.me
    dashboard: yard.localtest.me
    mcp: mcp.localtest.me
  tls:
    enabled: false
  storageClassName: local-path
  # Images are built locally and loaded with `k3d image import`, never pulled.
  imagePullPolicy: IfNotPresent

store:
  mariadb:
    storage: 2Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }
  wordpress:
    image:
      repository: switchyard-wordpress
      tag: dev
    storage: 2Gi
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: "1", memory: 512Mi }
